name: Portable builds

# One-file apps: OPxFlasher-<ver>-windows-x64.exe and OPxFlasher-<ver>-linux-x86_64.AppImage.
# Built and smoke-tested on every PR (downloadable from the run's artifacts).
# Released automatically: when main has a version (pyproject.toml) that has no
# v<version> release yet, the files are attached to a new pre-release and the
# tag is created. Bumping the version in a PR = publishing it once merged.
# Pushing a v* tag by hand also works.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # never cancel a release run

jobs:
  version:
    name: Release check
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v$ver"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          release=false
          if [ "$GITHUB_REF" = "refs/tags/$tag" ]; then
            release=true
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $ver, tag $tag, release now: $release"

  windows:
    name: Windows .exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install ".[gui,zstd]" "pyinstaller>=6.10"
      - name: Build and smoke test
        run: python packaging/build.py --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: OPxFlasher-windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    name: Linux AppImage
    # Built on the oldest supported runner so the AppImage runs on older distributions too.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Qt system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 file
      - name: Install
        run: python -m pip install ".[gui,zstd]" "pyinstaller>=6.10"
      - name: Build and smoke test
        run: python packaging/build.py --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: OPxFlasher-linux
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    if: needs.version.outputs.release == 'true'
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "OPxFlasher $TAG" --generate-notes --prerelease
          fi
