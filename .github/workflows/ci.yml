name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os == 'windows-latest' && 'Windows' || matrix.os == 'macos-latest' && 'macOS' || 'Linux' }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: python -m pip install ".[dev,zstd]"

      - name: Test
        run: python -m pytest -q -p no:cacheprovider

  package:
    name: Wheel contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build wheel
        run: python -m pip wheel --no-deps -w dist .

      - name: Check packaged data
        shell: python
        run: |
          import glob, sys, zipfile
          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          need = ["opx/profiles/oplus-generic.json", "opx/profiles/oneplus-13.json",
                  "opx/gui/assets/icon.svg"]
          need += [f"opx/gui/assets/icon-{s}.png" for s in (16, 24, 32, 48, 64, 128, 256)]
          missing = [n for n in need if n not in names]
          print("\n".join(sorted(n for n in names if n.startswith("opx/") and not n.endswith(".py"))))
          sys.exit(f"missing from wheel: {missing}" if missing else 0)
